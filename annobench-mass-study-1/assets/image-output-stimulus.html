<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Task Evaluation</title>
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #1a1a2e; }
        body { display: flex; flex-direction: column; padding: 24px; }
        .instruction { flex-shrink: 0; font-size: 14px; line-height: 1.5; color: #374151; margin-bottom: 32px; font-style: italic; text-align: center; }
        .prompt-line { flex-shrink: 0; font-size: 18px; line-height: 1.6; color: #374151; margin-bottom: 32px; }
        .prompt-line strong { color: #1a1a2e; }
        .images-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 8px 16px; align-content: start; }
        .images-grid img { width: 100%; max-height: calc(100vh - 200px); object-fit: contain; display: block; }
        .images-grid .label { text-align: center; font-size: 14px; font-weight: 600; color: #374151; }
    </style>
</head>
<body>
    <p class="instruction">Read the task prompt that was provided to the LLM for adding annotations to the chart. Then see the input and output images.</p>
    <p class="prompt-line"><strong>Task Prompt</strong>: <span id="promptText"></span></p>
    <div class="images-grid">
        <img id="inputImg" src="" alt="Original chart">
        <img id="outputImg" src="" alt="Model output">
        <span class="label">Input</span>
        <span class="label">Output</span>
    </div>
</body>
<script>
    Revisit.onDataReceive((data) => {
        document.getElementById('promptText').textContent = data.taskPrompt || '';
        document.getElementById('inputImg').src = data.inputImage || '';
        document.getElementById('outputImg').src = data.outputImage || '';
    });
</script>
</html>
