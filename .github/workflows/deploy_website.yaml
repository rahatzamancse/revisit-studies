name: Deploy To GitHub Pages

on:
  push:
    branches:
      - annobench
  workflow_dispatch:
  pull_request:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_RECAPTCHAV3TOKEN: ${{ secrets.VITE_RECAPTCHAV3TOKEN }}

      - uses: peaceiris/actions-gh-pages@v3
        name: Deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/dev'}}
    permissions:
      contents: write
    concurrency:
      group: dev-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Build dev branch
        run: yarn build
        env:
          VITE_BASE_PATH: "/dev/"
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_RECAPTCHAV3TOKEN: ${{ secrets.VITE_RECAPTCHAV3TOKEN }}

      - uses: peaceiris/actions-gh-pages@v3
        name: Deploy dev branch
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: "dev"

  pr-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

    steps:
      - name: Comment on PR
        uses: hasura/comment-progress@v2.2.0
        if: ${{ github.ref != 'refs/heads/annobench' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "Starting deployment of preview ⏳..."

      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Build annobench branch
        if: ${{ github.ref == 'refs/heads/annobench' }}
        run: yarn build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_RECAPTCHAV3TOKEN: ${{ secrets.VITE_RECAPTCHAV3TOKEN }}

      - uses: peaceiris/actions-gh-pages@v3
        name: Deploy annobench branch
        if: ${{ github.ref == 'refs/heads/annobench' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Build PR preview
        if: ${{ github.ref != 'refs/heads/annobench' }}
        run: yarn build
        env:
          VITE_BASE_PATH: "/study/PR${{ github.event.number }}/"
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_RECAPTCHAV3TOKEN: ${{ secrets.VITE_RECAPTCHAV3TOKEN }}

      - name: Push PR deploy preview
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref != 'refs/heads/annobench' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: "PR${{ github.event.number }}"

      - name: Update comment
        uses: hasura/comment-progress@v2.2.0
        if: ${{ github.ref != 'refs/heads/annobench' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "A preview of ${{ github.event.after }} is uploaded and can be seen here:\n\n ✨ https://revisit.dev/study/PR${{ github.event.number }} ✨\n\nChanges may take a few minutes to propagate."
