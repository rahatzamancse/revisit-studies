<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Task Evaluation</title>
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1a1a2e; padding: 24px; }
        .prompt-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .prompt-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 8px; }
        .prompt-text { font-size: 14px; line-height: 1.6; color: #374151; }
        .content-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: visible; display: flex; flex-direction: column; }
        .card-header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-size: 13px; font-weight: 600; color: #374151; flex-shrink: 0; }
        .card-body { padding: 12px; display: flex; align-items: center; justify-content: center; height: 420px; background: #fafafa; flex: 1; min-height: 0; }
        .card-body img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
        .text-output { padding: 16px; font-size: 14px; line-height: 1.7; color: #374151; white-space: pre-wrap; word-wrap: break-word; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; background: #f9fafb; height: 420px; box-sizing: border-box; overflow: auto; }
        @media (max-width: 768px) { .content-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="prompt-section">
        <div class="prompt-label">Task Prompt</div>
        <div id="promptText" class="prompt-text"></div>
    </div>
    <div class="content-container">
        <div class="card">
            <div class="card-header">Original Chart (Input)</div>
            <div class="card-body"><img id="inputImg" src="" alt="Original chart"></div>
        </div>
        <div class="card">
            <div class="card-header">Model Answer</div>
            <div id="modelOutput" class="text-output"></div>
        </div>
    </div>
</body>
<script>
    Revisit.onDataReceive((data) => {
        document.getElementById('promptText').textContent = data.taskPrompt || '';
        document.getElementById('inputImg').src = data.inputImage || '';
        document.getElementById('modelOutput').textContent = data.modelOutput || '';
    });
</script>
</html>
